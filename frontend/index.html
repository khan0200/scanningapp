<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAPS2 Web Scanner - Canon G3410 WIA/TWAIN Engine</title>
  
  <!-- External CDN Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Title Bar -->
  <div class="title-bar">
    <div class="title-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7V4a2 2 0 0 1 2-2h4M14 2h4a2 2 0 0 1 2 2v3M4 17v3a2 2 0 0 0 2 2h4M20 17v3a2 2 0 0 1-2 2h-4"/>
        <rect x="7" y="7" width="10" height="10" rx="1"/>
      </svg>
      <span>NAPS2 Web Document Scanner (Canon G3410 WIA/TWAIN)</span>
    </div>
    <div class="title-status" id="pageCounter">0 Pages</div>
  </div>

  <!-- Main Action Toolbar -->
  <div class="toolbar">
    <!-- Scanner Hardware Controls -->
    <div class="tb-group">
      <span class="tb-label">Scanner:</span>
      <select id="scannerSelect" class="select-control" style="min-width: 180px;">
        <option value="">Searching for scanners...</option>
      </select>
      <button class="btn" id="btnRefreshScanners" title="Refresh Scanner List">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
      <button class="btn btn-primary" id="btnScan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M4 7V4a2 2 0 0 1 2-2h4M14 2h4a2 2 0 0 1 2 2v3M4 17v3a2 2 0 0 0 2 2h4M20 17v3a2 2 0 0 1-2 2h-4"/>
          <path d="M7 12h10"/>
        </svg>
        Scan
      </button>
      <button class="btn btn-danger hidden-input" id="btnStopScan" title="Stop Active Scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="6" y="6" width="12" height="12"/>
        </svg>
        Stop Scan
      </button>
    </div>

    <div class="tb-divider"></div>

    <!-- Scan Settings Controls -->
    <div class="tb-group">
      <span class="tb-label">DPI:</span>
      <select id="dpiSelect" class="select-control">
        <option value="150">150 DPI</option>
        <option value="300" selected>300 DPI</option>
        <option value="600">600 DPI</option>
      </select>
    </div>

    <div class="tb-group">
      <span class="tb-label">Color:</span>
      <select id="colorSelect" class="select-control">
        <option value="Color" selected>Color</option>
        <option value="Grayscale">Grayscale</option>
        <option value="Black & White">Black & White</option>
      </select>
    </div>

    <div class="tb-group">
      <span class="tb-label">Source:</span>
      <select id="sourceSelect" class="select-control">
        <option value="Flatbed" selected>Flatbed</option>
        <option value="ADF">Automatic Document Feeder (ADF)</option>
      </select>
    </div>

    <div class="tb-group">
      <span class="tb-label">Paper:</span>
      <select id="paperSelect" class="select-control">
        <option value="A4" selected>A4</option>
        <option value="Letter">Letter</option>
        <option value="Auto">Auto Detect</option>
      </select>
    </div>

    <div class="tb-divider"></div>

    <!-- Additional Import & Edit Actions -->
    <div class="tb-group">
      <button class="btn" id="btnAddImage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        Add Image
      </button>
      <button class="btn" id="btnRotateLeft" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        Rotate Left
      </button>
      <button class="btn" id="btnRotateRight" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
        </svg>
        Rotate Right
      </button>
      <button class="btn btn-danger" id="btnDelete" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
        Delete
      </button>
    </div>

    <div class="tb-divider"></div>

    <!-- Export Actions -->
    <div class="tb-group">
      <button class="btn" id="btnSavePdf" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        Save PDF
      </button>
      <button class="btn" id="btnSaveJpg" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Save JPG
      </button>
      <button class="btn" id="btnClearAll" disabled>Clear All</button>
    </div>
  </div>

  <!-- Alert Banner -->
  <div class="alert-banner hidden" id="alertBanner">
    <span id="alertText">Scanner notice</span>
    <button class="btn" id="btnCloseAlert" style="padding: 0 6px; height: 22px;">✕</button>
  </div>

  <!-- Main Workspace -->
  <div class="workspace">
    <!-- Left Sidebar: Page Thumbnails -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span>PAGES</span>
        <span id="thumbnailCount">0 items</span>
      </div>
      <div class="thumbnail-list" id="thumbnailList"></div>
    </div>

    <!-- Right Large Preview Area -->
    <div class="preview-area">
      <div class="scanning-bar" id="scanningBar"></div>
      
      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <circle cx="12" cy="14" r="3"/>
        </svg>
        <div class="empty-title">No Document Pages</div>
        <div>Select your scanner above and click <strong>Scan</strong> or drop image files here.</div>
      </div>

      <!-- Preview Viewport -->
      <div class="preview-viewport hidden-input" id="previewViewport">
        <div class="preview-page-card" id="pageCard">
          <img id="previewImg" class="preview-img" alt="Scanned Document Page">
        </div>
      </div>

      <!-- Zoom Controls -->
      <div class="preview-controls hidden-input" id="previewControls">
        <button class="btn" id="btnZoomOut" title="Zoom Out">-</button>
        <span id="zoomLevelText" style="padding: 0 6px; font-weight: 500;">100%</span>
        <button class="btn" id="btnZoomIn" title="Zoom In">+</button>
        <button class="btn" id="btnZoomReset" title="Fit to Screen">Fit</button>
      </div>
    </div>
  </div>

  <!-- Hidden File Input -->
  <input type="file" id="fileInput" class="hidden-input" accept="image/*" multiple>

  <script src="app.js"></script>
</body>
</html>
